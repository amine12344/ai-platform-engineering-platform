apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: supportops-ml
automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: supportops-ml
  labels:
    app.kubernetes.io/name: mlflow
    supportops.io/component: model-lifecycle
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: supportops-ml
  labels:
    app.kubernetes.io/name: mlflow
    supportops.io/component: model-lifecycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        supportops.io/component: model-lifecycle
    spec:
      serviceAccountName: mlflow
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: localhost:5001/supportops/mlflow:3.15.0
          imagePullPolicy: Always
          args:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=$(MLFLOW_BACKEND_STORE_URI)
            - --serve-artifacts
            - --artifacts-destination=s3://supportops-models
            - --allowed-hosts=mlflow.supportops.local,localhost,127.0.0.1,0.0.0.0
            - --cors-allowed-origins=http://mlflow.supportops.local,http://localhost,http://127.0.0.1
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: backend-store-uri
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: aws-secret-access-key
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://seaweedfs.supportops-data.svc.cluster.local:8333
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 750m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: supportops-ml
  labels:
    app.kubernetes.io/name: mlflow
    supportops.io/component: model-lifecycle
spec:
  ingressClassName: nginx
  rules:
    - host: mlflow.supportops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  name: http
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  name: http
