[build-system]
requires = [
  "setuptools>=83",
  "wheel>=0.46"
]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-engineering-platform"
version = "0.1.0"
description = "SupportOps MLflow training lifecycle"
requires-python = ">=3.10"
dependencies = [
  "mlflow==3.15.0",
  "boto3==1.38.8",
  "psycopg2-binary==2.9.10",
  "scikit-learn==1.6.1"
]

[tool.setuptools]
py-modules = [
  "train",
  "lifecycle"
]