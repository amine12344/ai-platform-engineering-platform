name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API development dependencies
        run: python -m pip install -r services/supportops-api/requirements-dev.txt
      - name: Validate repository
        run: make validate
      - name: Run foundation tests
        run: make test-foundation
      - name: Run API tests
        run: make test-api
      - name: Lint API
        run: make lint-api
      - name: Compile Python
        run: python -m compileall datasets scripts services/supportops-api/src
